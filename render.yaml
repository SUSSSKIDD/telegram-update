services:
  - type: web
    name: meeting-booked-alerts
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -u run.py
    envVars:
      - key: METABASE_URL
        value: https://analytics.leapfinance.com
      - key: METABASE_QUESTION_ID
        value: "33308"
      - key: METABASE_EMAIL
        sync: false
      - key: METABASE_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: GOOGLE_SHEET_ID
        value: 1KGjoiLETt0ZZoxsPqQoWVShPQcs_c3-ODbiZANAlKQ8
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
